name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un nouveau push annule le run précédent sur la même branche / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_DEFAULT: '8.5'
  NODE_VERSION: '22'
  PHP_EXTENSIONS: mbstring, intl, bcmath, pdo_sqlite, sqlite3
  COMPOSER_FLAGS: --no-interaction --prefer-dist --no-progress

jobs:
  lint:
    name: Qualité du code (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_DEFAULT }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: cs2pr

      - name: Valider composer.json
        run: composer validate --strict

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ env.PHP_DEFAULT }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ env.PHP_DEFAULT }}-

      - name: Installer les dépendances PHP
        run: composer install ${{ env.COMPOSER_FLAGS }}

      - name: Vérifier le style (Pint)
        shell: bash # active pipefail
        run: vendor/bin/pint --test --format=checkstyle | cs2pr

  assets:
    name: Build front (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dépendances JS
        run: npm ci

      - name: Compiler les assets
        run: npm run build

      - name: Publier le build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vite-build
          path: public/build
          retention-days: 1
          if-no-files-found: error

  tests:
    name: Tests (PHP ${{ matrix.php }})
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # composer.lock exige PHP >= 8.4.1 (Symfony 8).
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Installer les dépendances PHP
        run: composer install ${{ env.COMPOSER_FLAGS }}

      - name: Récupérer le build Vite
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vite-build
          path: public/build

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Lancer les tests (Pest)
        run: php artisan test --compact

  security:
    name: Audit de sécurité
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_DEFAULT }}
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit Composer
        run: composer audit --locked --no-interaction

      - name: Audit npm
        run: npm audit --audit-level=high
