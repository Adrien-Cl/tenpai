name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Un nouveau push annule le run précédent sur la même branche / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_DEFAULT: '8.5'
  NODE_VERSION: '22'
  PHP_EXTENSIONS: mbstring, intl, bcmath, pdo_sqlite, sqlite3, gd, sockets
  COMPOSER_FLAGS: --no-interaction --prefer-dist --no-progress

jobs:
  lint:
    name: Qualité du code (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_DEFAULT }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: cs2pr

      - name: Valider composer.json
        run: composer validate --strict

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ env.PHP_DEFAULT }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ env.PHP_DEFAULT }}-

      - name: Installer les dépendances PHP
        run: composer install ${{ env.COMPOSER_FLAGS }}

      - name: Vérifier le style (Pint)
        shell: bash # active pipefail
        run: vendor/bin/pint --test --format=checkstyle | cs2pr

  assets:
    name: Front (Vitest et build Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dépendances JS
        run: npm ci

      - name: Tests JS (Vitest)
        run: npm test

      - name: Compiler les assets
        run: npm run build

      - name: Publier le build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vite-build
          path: public/build
          retention-days: 1
          if-no-files-found: error

  tests:
    name: Tests (PHP ${{ matrix.php }})
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # composer.lock exige PHP >= 8.4.1 (Symfony 8).
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Installer les dépendances PHP
        run: composer install ${{ env.COMPOSER_FLAGS }}

      - name: Récupérer le build Vite
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vite-build
          path: public/build

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Lancer les tests (Pest)
        run: php artisan test --compact --exclude-testsuite=Browser

  browser:
    name: Tests navigateur (Pest + Playwright)
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_DEFAULT }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ env.PHP_DEFAULT }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ env.PHP_DEFAULT }}-

      - name: Installer les dépendances
        run: |
          composer install ${{ env.COMPOSER_FLAGS }}
          npm ci
          npx playwright install --with-deps chromium

      - name: Récupérer le build Vite
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vite-build
          path: public/build

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Lancer les tests navigateur
        run: php artisan test --compact --testsuite=Browser

      - name: Garder les captures des échecs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Image Docker (build et démarrage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Un vrai nom de domaine, comme en production : trustHosts() refuse alors « localhost ».
      APP_URL: http://tenpai.example:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # En production, ce réseau appartient au reverse proxy ; compose exige qu'il existe déjà.
      - name: Créer le réseau du reverse proxy
        run: docker network create proxy

      - name: Construire et démarrer la stack
        run: docker compose up --detach --build --wait --wait-timeout 120

      - name: Vérifier que l'application répond
        shell: bash
        run: |
          set -euo pipefail
          base=$APP_URL

          curl() { command curl --resolve tenpai.example:8000:127.0.0.1 "$@"; }

          # Un hôte qui n'est pas celui d'APP_URL doit être refusé.
          [[ $(command curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/) != 200 ]] \
            || { echo "::error::Un hôte inconnu est servi : trustHosts() n'est pas actif"; exit 1; }

          check() {
            local path=$1 expected_type=$2
            local result
            result=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "$base$path")
            echo "$path → $result"
            [[ $result == "200 $expected_type"* ]] || { echo "::error::$path attendu 200 $expected_type, reçu $result"; exit 1; }
          }

          check /up text/html
          check / text/html
          check /en text/html
          check /bareme text/html
          check /comptage/tenpai text/html
          check /apprendre text/html
          check /apprendre/calcul-des-points text/html
          check /en/learn/glossary text/html
          check /tuiles.svg image/svg+xml
          check /favicon.ico image/x-icon
          check '/mains.json?graines=tenpai' application/json

          # Le sitemap et robots.txt sont servis par l'application, plus par des fichiers statiques.
          check /sitemap.xml application/xml
          check /robots.txt text/plain
          # Le contenu passe par une variable : avec pipefail, « curl | grep -q » échoue quand grep s'arrête
          # au premier résultat avant que curl ait tout écrit (« Failed writing body »).
          robots=$(curl -sS "$base/robots.txt")
          grep -qF "Sitemap: $base/sitemap.xml" <<<"$robots" \
            || { echo "::error::robots.txt ne cite pas le sitemap"; exit 1; }
          sitemap=$(curl -sS "$base/sitemap.xml")
          grep -qF "<loc>$base/apprendre</loc>" <<<"$sitemap" \
            || { echo "::error::Le sitemap ne liste pas /apprendre"; exit 1; }

          # Le .htaccess compresse le sprite des tuiles (mod_deflate et mod_filter, activés dans le Dockerfile).
          encoding=$(curl -sS -H 'Accept-Encoding: gzip' -o /dev/null -w '%header{content-encoding}' "$base/tuiles.svg")
          echo "/tuiles.svg (gzip) → $encoding"
          [[ $encoding == gzip ]] || { echo "::error::/tuiles.svg attendu compressé en gzip, reçu « $encoding »"; exit 1; }

          # Les fichiers servis par l'application ne posent aucun cookie : sinon Cloudflare ne les garde pas en cache.
          sprite=$(curl -sS "$base/" | grep -oE '/tuiles\.svg\?v=[a-z0-9]+' | head -n1)
          [[ -n $sprite ]] || { echo "::error::Aucun sprite des tuiles dans la page d'accueil"; exit 1; }
          for path in "$sprite" /apercu/tenpai.png /sitemap.xml /robots.txt '/mains.json?graines=tenpai'; do
            cookies=$(curl -sS -o /dev/null -D - "$base$path" | grep -ci '^set-cookie:' || true)
            echo "$path (cookies) → $cookies"
            [[ $cookies == 0 ]] || { echo "::error::$path pose un cookie : Cloudflare ne le gardera pas en cache"; exit 1; }
          done

          # Les pages gardent leur session (jeton CSRF), dans un cookie : aucun fichier de session sur le disque.
          headers=$(curl -sS -o /dev/null -D - "$base/bareme")
          grep -qi '^set-cookie: tenpai-session=' <<<"$headers" \
            || { echo "::error::/bareme ne pose pas le cookie de session"; exit 1; }
          sessions=$(docker compose exec -T app sh -c 'find storage/framework/sessions -type f ! -name .gitignore | wc -l')
          echo "Fichiers de session → $sessions"
          [[ $sessions == 0 ]] || { echo "::error::Des sessions sont écrites sur le disque ($sessions fichiers)"; exit 1; }

          # L'ancienne adresse du comptage (liens partagés, mains à revoir) redirige définitivement vers la nouvelle.
          redirect=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "$base/entrainement/tenpai")
          echo "/entrainement/tenpai → $redirect"
          [[ $redirect == "301 $base/comptage/tenpai" ]] || { echo "::error::/entrainement/tenpai attendu 301 vers /comptage/tenpai, reçu $redirect"; exit 1; }
          # Sans l'extension GD, l'aperçu redirige vers l'image générale : on exige le PNG dessiné.
          check /apercu/tenpai.png image/png

          css=$(curl -sS "$base/" | grep -oE '/build/assets/[^"]+\.css' | head -n1)
          [[ -n $css ]] || { echo "::error::Aucune feuille de style Vite dans la page d'accueil"; exit 1; }
          check "$css" text/css
          # Les fichiers Vite portent une empreinte : le .htaccess les garde en cache un an.
          cache=$(curl -sS -o /dev/null -w '%header{cache-control}' "$base$css")
          echo "$css (cache) → $cache"
          [[ $cache == *immutable* ]] || { echo "::error::$css attendu immutable, reçu « $cache »"; exit 1; }

          livewire=$(curl -sS "$base/comptage/tenpai" | grep -oE 'src="[^"]*livewire[^"]*"' | head -n1 | sed -E 's/^src="https?:\/\/[^/]+//; s/"$//')
          [[ -n $livewire ]] || { echo "::error::Aucun script Livewire dans la page d'entraînement"; exit 1; }
          check "$livewire" application/javascript

      - name: Vérifier que la clé survit à un redémarrage
        shell: bash
        run: |
          set -euo pipefail
          before=$(docker compose exec -T app cat /data/app.key)
          docker compose restart app
          docker compose up --wait --wait-timeout 60
          after=$(docker compose exec -T app cat /data/app.key)
          [[ -n $before && $before == "$after" ]] || { echo "::error::La clé d'application a changé au redémarrage"; exit 1; }
          curl -fsS -o /dev/null --resolve tenpai.example:8000:127.0.0.1 "$APP_URL/"

      - name: Journaux du conteneur
        if: always()
        run: docker compose logs app

      - name: Arrêter la stack
        if: always()
        run: docker compose down --volumes

  security:
    name: Audit de sécurité
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_DEFAULT }}
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit Composer
        run: composer audit --locked --no-interaction

      # Bloquant pour ce qui part en production. Les outils de build et de test (Vite, Vitest) ne quittent pas la CI
      # ni l'étape « assets » du Dockerfile : leurs alertes restent affichées, sans bloquer quand aucun correctif n'existe.
      - name: Audit npm (production)
        run: npm audit --audit-level=high --omit=dev

      - name: Audit npm (outils de développement, informatif)
        continue-on-error: true
        run: npm audit --audit-level=high

