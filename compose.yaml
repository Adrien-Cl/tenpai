services:
  app:
    build:
      context: .
      target: app
    # L'image est construite sur place depuis le Dockerfile : rien à télécharger d'un registre.
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: Tenpai
      APP_ENV: production
      APP_DEBUG: "false"
      # Laissée vide, une clé est générée au premier démarrage et gardée dans le volume « data ».
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8000}
      # Le reverse proxy, joint par le réseau Docker, termine le TLS : on croit ses en-têtes X-Forwarded-* (schéma, IP du visiteur).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
      APP_LOCALE: fr
      APP_FALLBACK_LOCALE: fr
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    volumes:
      - data:/data
      - storage:/var/www/html/storage
    networks:
      - proxy
    healthcheck:
      # La requête porte l'hôte d'APP_URL : en production, trustHosts() refuse tout autre hôte, dont « localhost ».
      test: ["CMD-SHELL", "host=$${APP_URL#*://}; curl -fsS -o /dev/null -H \"Host: $${host%%/*}\" http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  data:
  storage:

networks:
  # Réseau partagé avec le reverse proxy, créé hors du projet : docker network create proxy
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
